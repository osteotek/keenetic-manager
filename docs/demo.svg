<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Keenetic Policy CLI interactive selector</title>
  <desc id="desc">A terminal displaying connected clients with the current device selected.</desc>
  <rect width="920" height="300" rx="12" fill="#111827"/>
  <rect width="920" height="38" rx="12" fill="#1f2937"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#22c55e"/>
  <g fill="#d1d5db" font-family="monospace" font-size="17">
    <text x="24" y="72">Connected clients:</text>
    <text x="24" y="104" fill="#9ca3af">Use Up/Down arrows, Enter to select, or Esc/q to cancel.</text>
    <text x="24" y="145">    Laptop                           192.168.1.10    Default</text>
    <text x="24" y="180">    Phone                            192.168.1.20    Direct</text>
    <rect x="16" y="194" width="845" height="34" rx="4" fill="#374151"/>
    <text x="24" y="218" fill="#86efac">&gt; * Workstation (this device)         192.168.1.30    VPN</text>
    <text x="24" y="262" fill="#6b7280">keenetic-policy 1.0.0</text>
  </g>
</svg>
